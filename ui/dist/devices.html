<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PiControl Devices</title>
  <script type="module" crossorigin src="/assets/devices-CjUoneAH.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/dom-C2tdIDSm.js">
  <link rel="stylesheet" crossorigin href="/assets/devices-BTi4VaXs.css">
</head>
<body>
  <header>
    <div class="brand-group">
      <a href="/" class="back-btn" title="Back to Home">← Back</a>
      <div class="brand">Pi<span>Control</span> Devices</div>
    </div>
    <div class="meta">
      <a href="composite.html" class="back-btn">Composite →</a>
      <span id="api-status" class="pill">Connecting</span>
    </div>
  </header>

  <main>
    <section class="card" id="cameras-card">
      <h2>Cameras</h2>
      <div id="cameras" class="cameras"></div>
      <p class="error" id="cameras-error"></p>
    </section>

    <section class="card" id="atem-card">
      <h2>ATEM switcher</h2>
      <p class="muted" id="atem-state">Not loaded</p>
      <form id="atem-form" class="row">
        <label>Input <input id="atem-input" type="number" min="1" max="40" value="1"></label>
        <button type="submit" data-atem="program">Program</button>
        <button type="button" data-atem="preview">Preview</button>
        <button type="button" id="atem-cut">Cut</button>
      </form>
      <p class="error" id="atem-error"></p>
    </section>

    <section class="card" id="outputs-card">
      <h2>HDMI outputs</h2>
      <div id="outputs"></div>
      <p class="error" id="outputs-error"></p>
    </section>
  </main>
</body>
</html>
