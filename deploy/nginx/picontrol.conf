# ==============================================================================
# picontrol - Nginx Reverse Proxy & Static Host Configuration
# ==============================================================================
# Ecosystem: picontrol UI, pigateway, picontrol-mcp, picanva
# Domain: Church domain (e.g. keskuskirkko.fi or control.keskuskirkko.fi)
# Resolution: Local router DNS override / split-horizon DNS maps domain to Pi LAN IP
# ==============================================================================

# Upstream definitions
upstream pigateway_backend {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream picontrol_mcp_backend {
    server 127.0.0.1:3200;
    keepalive 16;
}

upstream picanva_backend {
    server 127.0.0.1:3103;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # Church domain name(s) configured in local router DNS & Pi /etc/hosts
    server_name keskuskirkko.fi control.keskuskirkko.fi kirkonpi.local localhost;

    # Root directory pointing to the static build of picontrol UI
    root /var/www/picontrol/ui/dist;
    index index.html;

    # Client upload limits (e.g. ad-hoc media, thumbnails, presets)
    client_max_body_size 50M;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --------------------------------------------------------------------------
    # 1. Static Assets & Single Page Application (SPA) Routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static Vite assets with content hash immutably
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Multiview standalone HTML page
    location = /multiview.html {
        try_files /multiview.html =404;
    }

    # Component Catalog standalone HTML page
    location = /catalog {
        try_files /catalog.html =404;
    }
    location = /catalog.html {
        try_files /catalog.html =404;
    }

    # --------------------------------------------------------------------------
    # 2. pigateway API Reverse Proxy (/api, /multiview, /pipgm)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://pigateway_backend;
        proxy_http_version 1.1;

        # WebSocket / Connection upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Standard proxy forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for general REST requests
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Server-Sent Events (SSE) telemetry stream (/api/v1/events)
    # Critical: buffering must be disabled for real-time delivery
    location /api/v1/events {
        proxy_pass http://pigateway_backend/api/v1/events;
        proxy_http_version 1.1;

        # Clear Connection header to maintain persistent HTTP/1.1 keepalive
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and cache for SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Prevent SSE stream timeout during quiet periods
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Gateway multiview & pipgm proxy shortcuts
    location /multiview {
        proxy_pass http://pigateway_backend/multiview;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /pipgm {
        proxy_pass http://pigateway_backend/pipgm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --------------------------------------------------------------------------
    # 3. picontrol-mcp Reverse Proxy (/mcp)
    # --------------------------------------------------------------------------
    location /mcp {
        proxy_pass http://picontrol_mcp_backend/mcp;
        proxy_http_version 1.1;

        # Forward authorization headers for Bearer PAT tokens & OAuth
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Streamable HTTP / SSE streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 4. picanva Reverse Proxy (/canva or dedicated port)
    # --------------------------------------------------------------------------
    location /canva/ {
        proxy_pass http://picanva_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 5. Dedicated Canva Port (Optional / Alternative configuration)
# Canva often requires HTTPS on port 8443 or a separate dedicated host/port.
# ------------------------------------------------------------------------------
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name keskuskirkko.fi gateway.keskuskirkko.fi;

    # TLS Certificates (self-signed for local LAN or Let's Encrypt / local CA)
    # ssl_certificate /etc/ssl/certs/keskuskirkko.crt;
    # ssl_certificate_key /etc/ssl/private/keskuskirkko.key;

    location / {
        proxy_pass http://picanva_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
